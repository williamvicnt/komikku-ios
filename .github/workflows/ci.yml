name: iOS build

# Compiles the project on a macOS runner so compile errors show up without a local Mac.
# It does NOT sign or install the app; it only checks that everything builds and the
# KomikkuCore unit tests pass.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test KomikkuCore (swift test)
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iOS Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Komikku.xcodeproj \
            -scheme Komikku \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log

      - name: Summarize compile errors
        if: failure()
        run: |
          {
            echo "## Compile errors"
            echo
            echo '```'
            grep -hE "error:|warning: unable to" swift-test.log xcodebuild.log 2>/dev/null | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            swift-test.log
            xcodebuild.log
          if-no-files-found: ignore
