# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate && open Komikku.xcodeproj
name: Komikku
options:
  bundleIdPrefix: dev.example          # TODO: replace with your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
packages:
  KomikkuCore:
    path: .
targets:
  Komikku:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: KomikkuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.komikku-ios   # TODO: replace
        PRODUCT_NAME: Komikku
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Komikku
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
